<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 220" role="img" aria-label="4-Bit Processor: a working CPU built from bare logic gates, with an ALU, program counter, memory and control logic.">
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    .m { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .led { fill: #21262d; animation-name: bit; animation-timing-function: steps(1); animation-iteration-count: infinite; }
    .b0 { animation-duration: 1s } .b1 { animation-duration: 2s } .b2 { animation-duration: 4s } .b3 { animation-duration: 8s }
    @keyframes bit { 0% { fill: #21262d } 50% { fill: #3fb950 } 100% { fill: #3fb950 } }
    .st { fill: #484f58; animation: stage 1.5s steps(1) infinite; }
    .s2 { animation-delay: 0.5s } .s3 { animation-delay: 1s }
    @keyframes stage { 0% { fill: #e6edf3 } 33.3% { fill: #484f58 } 100% { fill: #484f58 } }
  </style>
  <rect x="1" y="1" width="598" height="218" rx="14" fill="#0d1117" stroke="#30363d" stroke-width="2"/>
  <text x="28" y="54" font-size="28" font-weight="700" fill="#e6edf3">4-Bit Processor</text>
  <text x="28" y="88" font-size="15" fill="#9198a1">A working CPU wired up from bare</text>
  <text x="28" y="110" font-size="15" fill="#9198a1">logic gates: ALU, program counter,</text>
  <text x="28" y="132" font-size="15" fill="#9198a1">memory and control logic.</text>
  <text class="m" x="28" y="190" font-size="12" fill="#6e7681" letter-spacing="1">DIGITAL LOGIC · BUILT GATE BY GATE</text>

  <text class="m" x="368" y="52" font-size="11" fill="#6e7681" letter-spacing="1">PROGRAM COUNTER</text>
  <path d="M368,100 H572" stroke="#21262d" stroke-width="2"/>
  <g stroke="#30363d" stroke-width="2">
    <circle class="led b3" cx="395" cy="100" r="17"/>
    <circle class="led b2" cx="445" cy="100" r="17"/>
    <circle class="led b1" cx="495" cy="100" r="17"/>
    <circle class="led b0" cx="545" cy="100" r="17"/>
  </g>
  <g class="m" font-size="11" fill="#6e7681" text-anchor="middle">
    <text x="395" y="138">8</text><text x="445" y="138">4</text><text x="495" y="138">2</text><text x="545" y="138">1</text>
  </g>
  <g class="m" font-size="11" letter-spacing="1">
    <text class="st" x="368" y="168">FETCH</text>
    <text class="st s2" x="432" y="168">DECODE</text>
    <text class="st s3" x="504" y="168">EXECUTE</text>
  </g>
</svg>
